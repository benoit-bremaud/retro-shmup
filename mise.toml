# Local CI toolchain (#156, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. System tools stay outside mise:
# sonar-scanner (not in the mise registry, skill infra-accounts) and the Playwright browsers
# (`pnpm exec playwright install chromium firefox webkit`, ADR-0026).
#
# Node and pnpm match .nvmrc / package.json#packageManager (Cloudflare Pages builds with the same
# Node major, ADR-0016), so the hooks run the project's own toolchain whether or not the shell
# activates mise. Not here, on purpose (rule 1 of the skill): typos (the FR message catalogue and
# the country table are not English), osv-scanner and Trivy (`pnpm audit` already audits the
# lockfile, ADR-0013; no Dockerfile), actionlint and zizmor (no workflow is left, ADR-0029).
[tools]
node = "22.23.4"
pnpm = "10.30.3"
just = "1.59.0"
lefthook = "2.2.2"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
"pipx:semgrep" = "1.183.0" # Semgrep Community Edition (SAST, replaces CodeQL)

[env]
# The standalone pnpm binary ships its own CA bundle and refuses the certificate the Aikido
# safe-chain proxy presents for registry.npmjs.org (`pnpm audit`, `pnpm install`); the system
# bundle holds that CA (skill aikido-device-protection).
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[settings]
lockfile = true
