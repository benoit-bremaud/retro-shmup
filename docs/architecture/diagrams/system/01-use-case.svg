@startuml 01-use-case
title uc — retro-shmup — player goals (1.0)
left to right direction
skinparam shadowing false

actor "Player" as Player
actor "Feedback form\n(external, Tally)" as FeedbackForm
actor "Online leaderboard\n(retro-leaderboard)" as Leaderboard

rectangle "retro-shmup (web game, 1.0)" {
  package "Play" {
    usecase UC1 as "UC1 Play a run
    - -
    extension points
    any moment of play
    run end"
    usecase "UC2 Pause the run" as UC2
  }
  package "Progress" {
    usecase "UC3 Record a high score" as UC3
    usecase "UC4 Consult the high scores" as UC4
    usecase "UC9 Publish a run on the online board" as UC9
    usecase "UC10 Follow and erase my online runs" as UC10
  }
  package "Settings" {
    usecase "UC5 Configure the game" as UC5
    usecase "UC6 Remap the controls" as UC6
  }
  package "About" {
    usecase "UC7 Read the credits" as UC7
    usecase "UC8 Give feedback on the game" as UC8
  }
}

Player - -> UC1
Player - -> UC2
Player - -> UC4
Player - -> UC5
Player - -> UC6
Player - -> UC7
Player - -> UC8
Player - -> UC10
UC8 - -> FeedbackForm
UC9 - -> Leaderboard
UC10 - -> Leaderboard

UC2 -[hidden]- UC3

UC2 .> UC1 : <<extend>>
note on link
  condition: {pause intent}
  extension point: any moment of play
end note
UC3 .> UC1 : <<extend>>
note on link
  condition: {final score enters the top 10}
  extension point: run end
end note
UC9 .> UC1 : <<extend>>
note on link
  condition: {release build on the final origin,
  run ended by game over or cleared, score > 0,
  recording not overflowed}
  extension point: run end
end note
@enduml

