# Local SonarQube analysis (ADR-0007). The token is never stored here:
# make sonar-scan reads it from ~/.config/sonar-tokens/retro-shmup.
sonar.projectKey=retro-shmup
sonar.projectName=retro-shmup
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
# Fail clearly instead of hanging the pre-push hook (ADR-0007 budget).
sonar.qualitygate.timeout=120

# The composition root is covered by the browser smoke test, not by unit tests (ADR-0003 §7).
sonar.coverage.exclusions=src/app/main.ts

# Accepted: SpriteId, SfxId and TrackId are domain vocabulary fixed by ADR-0001, ADR-0003 and
# ADR-0009 and used by the class diagram; they will become literal unions generated from the asset
# manifest. Scoped to rule S6564 (redundant type alias) in src/domain/ports only.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e1.resourceKey=src/domain/ports/**

# Accepted: no allocation inside the game loop (CLAUDE.md). A for...of over an array allocates an
# iterator below V8's optimizing tier, so source code uses index loops and ESLint bans for...of in
# src/. Scoped to rule S4138 (prefer for-of), the counterpart of the disabled ESLint rule.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**

# Accepted: the composition root draws each run's seed with Math.random (ADR-0014 decision 7,
# ADR-0019 decision 1). It seeds a game run, never anything security-related (no account, token or
# secret exists; security policy CRYPTO-3 targets security uses). Scoped to rule S2245
# (pseudo-random generator hotspot) in src/app/main.ts only, the one module allowed Math.random.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=src/app/main.ts

# Accepted (#134): the music files are fetched and decoded one at a time, the track asked for
# first, on purpose: decoding them all at once delays every track, the title's included, by
# seconds on a slow device (WebAudioPlayer.loadTracks). Scoped to rule S9382 (awaits in a loop)
# in that adapter only.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e4.resourceKey=src/adapters/web-audio-player.ts

# Accepted (#134): the browser smoke test plays the game as a player would, through the canvas
# only, with no test-only hook (ADR-0026). Its remaining fixed waits follow the game's own time
# rules, which draw nothing when they end: the menus' 150 ms press guard, a key held across
# 60 Hz steps, the 2 s fly-in and blink, the 1 s count-in after a resume, the title's 1 s lock.
# Waits on a visible state use expect.poll instead. Scoped to rule S2925 (fixed waits in tests) in tests/smoke only.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.e5.resourceKey=tests/smoke/**
