# Local SonarQube analysis (ADR-0007). The token is never stored here:
# make sonar-scan reads it from ~/.config/sonar-tokens/retro-shmup.
sonar.projectKey=retro-shmup
sonar.projectName=retro-shmup
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
# Fail clearly instead of hanging the pre-push hook (ADR-0007 budget).
sonar.qualitygate.timeout=120

# The composition root is covered by the browser smoke test, not by unit tests (ADR-0003 §7).
sonar.coverage.exclusions=src/app/main.ts

# Accepted: SpriteId, SfxId and TrackId are domain vocabulary fixed by ADR-0001, ADR-0003 and
# ADR-0009 and used by the class diagram; they will become literal unions generated from the asset
# manifest. Scoped to rule S6564 (redundant type alias) in src/domain/ports only.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e1.resourceKey=src/domain/ports/**

# Accepted: no allocation inside the game loop (CLAUDE.md). A for...of over an array allocates an
# iterator below V8's optimizing tier, so source code uses index loops and ESLint bans for...of in
# src/. Scoped to rule S4138 (prefer for-of), the counterpart of the disabled ESLint rule.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**
