# Dependabot — keeps the SHA-pinned GitHub Actions in .github/workflows current.
# Each bump PR carries the new SHA and refreshes the trailing "# vX.Y.Z" comment.
#
# The `npm` ecosystem block is added with the vertical slice, when package.json
# and the lockfile exist.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
