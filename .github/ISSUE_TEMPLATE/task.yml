name: Task / Chore
description: Technical task, refactoring, documentation, design or maintenance work.
title: 'chore(<scope>): <short description>'
labels: ['type:chore']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this task affect? (becomes the `area:*` label)
      options:
        - design
        - uml
        - engine
        - game
        - render
        - audio
        - input
        - ui
        - levels
        - assets
        - ci
        - docs
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Chore (config, tooling, dependencies)
        - Refactor (code improvement, no behaviour change)
        - Design (GDD revision, ADR, UML study)
        - Documentation
        - CI/CD
        - Testing
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: How do we know this task is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Files to modify, dependencies, related issues.

  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must-Have
        - Should-Have
        - Nice-to-Have
    validations:
      required: true

  - type: dropdown
    id: estimation
    attributes:
      label: Estimation (T-shirt)
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true
