# Dependency review — blocks a PR that introduces a dependency with a known
# vulnerability of severity high or critical.
#
# DORMANT — manual trigger only. The action relies on the dependency graph
# diff API, which requires GitHub Advanced Security on a private Free-plan
# repository; every run would fail with "not supported on this repository".
# `workflow_dispatch` is present only because a workflow needs at least one
# trigger: a manual run has no PR to diff (base-ref / head-ref are not set) and
# is not expected to succeed.
#
# Activation: a dedicated PR restoring the `pull_request` trigger below, after
# the repository is public. There is no package manifest yet either; the npm
# dependencies arrive with the vertical slice.
name: Dependency review

on:
  workflow_dispatch: {}
  # Restore once the repository is public:
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
