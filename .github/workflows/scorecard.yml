# OSSF Scorecard — weekly audit of the repository's security hygiene (security-ci-baseline).
# Non-blocking by design (ADR-0007): it runs on main and weekly, never on pull requests, and
# publishes its findings to the Security tab. Follows the official template of ossf/scorecard;
# when results are published, the workflow must keep: no top-level env or defaults, no
# workflow-level write permission, only approved actions in this job.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC

# Scorecard reads many repository APIs; read-only at workflow level (official template).
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload to code scanning
      id-token: write # OIDC token to publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
